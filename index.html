<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --card: rgba(30, 41, 59, 0.92);
    --card-border: rgba(148, 163, 184, 0.18);
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --warn: #f59e0b;
    --warn-bg: rgba(120, 53, 15, 0.55);
    --danger: #ef4444;
    --danger-bg: rgba(127, 29, 29, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at top, var(--bg-2), var(--bg-1));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .amagat {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(2, 6, 23, 0.72);
    backdrop-filter: blur(6px);
    z-index: 1000;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    opacity: 1;
    visibility: visible;
    transition: opacity 0.25s ease;
  }

  .targeta {
    width: 100%;
    max-width: 480px;
    max-height: 100%;
    overflow-y: auto;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }

  .icona { font-size: 2.2rem; line-height: 1; margin-bottom: 8px; }

  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 20px 0 8px;
    text-align: left;
  }

  .targeta-avis { background: var(--warn-bg); border-color: rgba(245, 158, 11, 0.4); }
  .targeta-error { background: var(--danger-bg); border-color: rgba(239, 68, 68, 0.4); }

  .descripcio, .normes {
    white-space: pre-wrap;
    text-align: left;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0;
  }

  .detalls {
    text-align: left;
    list-style: none;
    padding: 0;
    margin: 16px 0 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.92rem;
    color: var(--text-muted);
  }
  .detalls li strong { color: var(--text); }

  .camp {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
    margin-top: 14px;
  }
  .camp label { font-size: 0.85rem; color: var(--text-muted); }
  .camp input {
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: rgba(15, 23, 42, 0.6);
    color: var(--text);
  }
  .camp input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
  }

  #error-formulari { color: #fca5a5; min-height: 1.2em; margin-top: 10px; font-size: 0.88rem; }

  .btn {
    margin-top: 18px;
    width: 100%;
    padding: 13px 24px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #475569; cursor: not-allowed; }

  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 14px;
    border-radius: 50%;
    border: 3px solid rgba(148, 163, 184, 0.3);
    border-top-color: var(--accent);
    animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  #pantalla-examen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #000;
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  #barra-superior {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-right));
    padding-top: max(10px, env(safe-area-inset-top));
    background: #0b1220;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  }
  #cronometre { font-weight: 700; letter-spacing: 0.03em; }
  #avisos-comptador {
    background: rgba(245, 158, 11, 0.15);
    color: var(--warn);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  #forms-frame { flex: 1; border: none; width: 100%; background: #fff; }
</style>
</head>
<body>

  <div id="pantalla-carrega" class="overlay">
    <div class="targeta">
      <div class="spinner"></div>
      <p class="descripcio" style="text-align:center">Carregant l'examen…</p>
    </div>
  </div>

  <div id="pantalla-inici" class="overlay amagat">
    <div class="targeta">
      <h1 id="titol-examen"></h1>
      <p class="descripcio" id="descripcio-examen"></p>
      <h2>Normes</h2>
      <p class="normes" id="normes-examen"></p>
      <ul class="detalls">
        <li>⏱ Temps: <strong id="detall-temps"></strong> minuts</li>
        <li>⚠️ Avisos permesos abans de suspendre: <strong id="detall-avisos"></strong></li>
      </ul>

      <form id="formulari-inici">
        <div class="camp">
          <label for="input-nom">Nom i cognoms</label>
          <input type="text" id="input-nom" autocomplete="name" required>
        </div>
        <div class="camp">
          <label for="input-correu">Correu</label>
          <input type="email" id="input-correu" autocomplete="email" required>
        </div>
        <div id="error-formulari"></div>
        <button type="submit" class="btn" id="btn-comenzar">Comenzar examen</button>
      </form>
    </div>
  </div>

  <div id="pantalla-examen" class="amagat">
    <div id="barra-superior">
      <span id="cronometre">--:--</span>
      <span id="avisos-comptador">⚠️ <span id="avisos-actuals">0</span>/<span id="avisos-max-barra"></span></span>
    </div>
    <iframe id="forms-frame" allow="fullscreen"></iframe>
  </div>

  <div id="overlay-avis" class="overlay amagat">
    <div class="targeta targeta-avis">
      <div class="icona">⚠️</div>
      <h1 id="avis-titol">Avís</h1>
      <p id="avis-missatge"></p>
      <button class="btn" id="btn-tornar-fullscreen">Tornar a pantalla completa</button>
    </div>
  </div>

  <div id="overlay-suspes" class="overlay amagat">
    <div class="targeta targeta-error">
      <div class="icona">⛔</div>
      <h1>Has estat suspès</h1>
      <p>Has superat el nombre màxim d'avisos. Parla amb el professor/a.</p>
    </div>
  </div>

  <div id="overlay-temps" class="overlay amagat">
    <div class="targeta targeta-error">
      <div class="icona">⏰</div>
      <h1>S'ha acabat el temps</h1>
      <p>Envia el formulari ara mateix si encara no ho has fet.</p>
    </div>
  </div>

  <div id="overlay-error" class="overlay amagat">
    <div class="targeta targeta-error">
      <div class="icona">❌</div>
      <h1 id="error-titol">Error</h1>
      <p id="error-missatge"></p>
    </div>
  </div>

  <script>
  // ⚠️ Substitueix això per la URL ".../exec" del teu desplegament d'Apps Script.
  var API_URL = 'https://script.google.com/macros/s/AKfycbw5ushrjd0lwANATBo9_VHgYDGa4De_HeA023NSHsA7Lb22B7DTvZk3gI_WO6_XeFarfA/exec';

  (function () {
    var comptadorAvisos = 0;
    var avisosMax = 0;
    var suspes = false;
    var examenIniciat = false;
    var ultimAvisTimestamp = 0;
    var DEDUP_MS = 1500;
    var timerInterval = null;
    var token = null;

    var pantallaCarrega = document.getElementById('pantalla-carrega');
    var pantallaInici = document.getElementById('pantalla-inici');
    var pantallaExamen = document.getElementById('pantalla-examen');
    var overlayAvis = document.getElementById('overlay-avis');
    var overlaySuspes = document.getElementById('overlay-suspes');
    var overlayTemps = document.getElementById('overlay-temps');
    var overlayError = document.getElementById('overlay-error');
    var avisTitol = document.getElementById('avis-titol');
    var avisMissatge = document.getElementById('avis-missatge');
    var avisosActuals = document.getElementById('avisos-actuals');
    var cronometre = document.getElementById('cronometre');
    var iframe = document.getElementById('forms-frame');
    var errorFormulari = document.getElementById('error-formulari');
    var btnComenzar = document.getElementById('btn-comenzar');

    fetch(API_URL)
      .then(function (res) { return res.json(); })
      .then(function (config) {
        if (config.estat !== 'ACTIU') {
          mostraError("Examen no disponible", "Aquest examen no està actiu ara mateix. Parla amb el professor/a.");
          return;
        }
        document.getElementById('titol-examen').textContent = config.titol;
        document.getElementById('descripcio-examen').textContent = config.descripcio;
        document.getElementById('normes-examen').textContent = config.normes;
        document.getElementById('detall-temps').textContent = config.tempsMinuts;
        document.getElementById('detall-avisos').textContent = config.avisosMax;
        document.getElementById('avisos-max-barra').textContent = config.avisosMax;
        document.title = config.titol || 'Examen';
        avisosMax = config.avisosMax;

        pantallaCarrega.classList.add('amagat');
        pantallaInici.classList.remove('amagat');
      })
      .catch(function () {
        mostraError('Error de connexió', "No s'ha pogut contactar amb el servidor de l'examen. Torna-ho a provar.");
      });

    document.getElementById('formulari-inici').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var nom = document.getElementById('input-nom').value.trim();
      var correu = document.getElementById('input-correu').value.trim();
      errorFormulari.textContent = '';
      btnComenzar.disabled = true;

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'start', nom: nom, correu: correu })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.error) {
            errorFormulari.textContent = data.missatge || 'No es pot començar l\'examen.';
            btnComenzar.disabled = false;
            return;
          }
          if (data.suspended) {
            comptadorAvisos = data.avisos;
            pantallaInici.classList.add('amagat');
            overlaySuspes.classList.remove('amagat');
            return;
          }
          token = data.token;
          avisosMax = data.avisosMax;
          comptadorAvisos = data.avisos;
          comencarExamen(data);
        })
        .catch(function () {
          errorFormulari.textContent = 'Error de connexió. Torna-ho a provar.';
          btnComenzar.disabled = false;
        });
    });

    document.getElementById('btn-tornar-fullscreen').addEventListener('click', function () {
      demanaFullscreen();
      ocultarAvis();
    });

    function comencarExamen(data) {
      demanaFullscreen();
      iframe.src = data.formsUrl + (data.formsUrl.indexOf('?') === -1 ? '?' : '&') + 'embedded=true';
      pantallaInici.classList.add('amagat');
      pantallaExamen.classList.remove('amagat');
      avisosActuals.textContent = comptadorAvisos;
      examenIniciat = true;
      iniciarCronometre(data.timestampInici, data.tempsMinuts);
      comprovarPantallesConnectades();
    }

    function demanaFullscreen() {
      var el = document.documentElement;
      var request = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (request) request.call(el);
    }

    function estaEnFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function iniciarCronometre(timestampInici, tempsMinuts) {
      var finMs = timestampInici + tempsMinuts * 60 * 1000;
      timerInterval = setInterval(function () {
        var restant = finMs - Date.now();
        if (restant <= 0) {
          clearInterval(timerInterval);
          cronometre.textContent = '00:00';
          tempsExhaurit();
          return;
        }
        var min = Math.floor(restant / 60000);
        var seg = Math.floor((restant % 60000) / 1000);
        cronometre.textContent = (min < 10 ? '0' : '') + min + ':' + (seg < 10 ? '0' : '') + seg;
      }, 1000);
    }

    function tempsExhaurit() {
      if (suspes) return;
      overlayTemps.classList.remove('amagat');
      enviarEstat_('finish', 'timeout');
    }

    function mostraAvis(missatge) {
      avisTitol.textContent = 'Avís ' + comptadorAvisos + '/' + avisosMax;
      avisMissatge.textContent = missatge;
      overlayAvis.classList.remove('amagat');
    }

    function ocultarAvis() {
      overlayAvis.classList.add('amagat');
    }

    function mostraSuspes() {
      suspes = true;
      if (timerInterval) clearInterval(timerInterval);
      overlayAvis.classList.add('amagat');
      pantallaExamen.classList.add('amagat');
      overlaySuspes.classList.remove('amagat');
    }

    function mostraError(titol, missatge) {
      pantallaCarrega.classList.add('amagat');
      pantallaInici.classList.add('amagat');
      document.getElementById('error-titol').textContent = titol;
      document.getElementById('error-missatge').textContent = missatge;
      overlayError.classList.remove('amagat');
    }

    /**
     * El navegador sovint talla la xarxa just quan la pestanya passa a
     * segon pla (típic en mòbil en canviar d'app), així que no podem
     * esperar la resposta del servidor per avisar: comptem l'avís de
     * seguida en local i l'enviem amb sendBeacon/keepalive, dissenyats
     * per sobreviure encara que la pàgina quedi oculta o es tanqui.
     */
    function registrarAvis(motiu) {
      if (!examenIniciat || suspes) return;
      var ara = Date.now();
      if (ara - ultimAvisTimestamp < DEDUP_MS) return;
      ultimAvisTimestamp = ara;

      comptadorAvisos += 1;
      avisosActuals.textContent = comptadorAvisos;

      if (avisosMax > 0 && comptadorAvisos >= avisosMax) {
        mostraSuspes();
      } else {
        mostraAvis(motiu);
      }

      enviarAvis_(motiu);
    }

    function enviarAvis_(motiu) {
      var payload = JSON.stringify({ action: 'warning', token: token, reason: motiu });
      if (navigator.sendBeacon && navigator.sendBeacon(API_URL, payload)) return;
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: payload,
        keepalive: true
      }).catch(function () {});
    }

    function enviarEstat_(accio, estat) {
      var payload = JSON.stringify({ action: accio, token: token, status: estat });
      if (navigator.sendBeacon && navigator.sendBeacon(API_URL, payload)) return;
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: payload,
        keepalive: true
      }).catch(function () {});
    }

    function comprovarPantallesConnectades() {
      if (!window.getScreenDetails) return;
      window.getScreenDetails()
        .then(function (details) {
          function comprova() {
            if (details.screens.length > 1) {
              registrarAvis("S'ha detectat una segona pantalla connectada");
            }
          }
          comprova();
          details.addEventListener('screenschange', comprova);
        })
        .catch(function () {
          // L'alumne ha denegat el permís o el navegador no ho suporta: no és
          // crític, és una senyal complementària, no la base de la detecció.
        });
    }

    document.addEventListener('fullscreenchange', function () {
      if (examenIniciat && !suspes && !estaEnFullscreen()) {
        registrarAvis('Ha sortit de pantalla completa');
      }
    });
    document.addEventListener('webkitfullscreenchange', function () {
      if (examenIniciat && !suspes && !estaEnFullscreen()) {
        registrarAvis('Ha sortit de pantalla completa');
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (examenIniciat && !suspes && document.hidden) {
        registrarAvis('Ha canviat de pestanya o minimitzat la finestra');
      }
    });

    // Deliberadament NO escoltem window.blur: com que el Forms es mostra en
    // un <iframe>, el focus hi entra cada cop que l'alumne toca una
    // pregunta, i el navegador dispara blur a la finestra superior encara
    // que l'alumne no hagi sortit de la pàgina. visibilitychange i
    // fullscreenchange ja cobreixen canviar de pestanya/aplicació sense
    // aquest fals positiu.

    window.addEventListener('pagehide', function () {
      if (examenIniciat && !suspes) {
        registrarAvis('Ha tancat o recarregat la pàgina');
      }
    });

    window.addEventListener('beforeunload', function (e) {
      if (examenIniciat && !suspes) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  })();
  </script>
</body>
</html>
